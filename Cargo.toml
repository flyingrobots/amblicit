[workspace]
members = [
  "crates/amblicit",
  "crates/amblicit-cli",
  "crates/amblicit-provider-host-wasmtime",
  "crates/amblicit-provider-schema",
  "crates/amblicit-syntax",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/flyingrobots/amblicit"
rust-version = "1.96"

# Maximize strictness (flyingrobots house rule): no unsafe, warnings are errors.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
