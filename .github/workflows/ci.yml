name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust ${{ matrix.rust-label }} (fmt · clippy · test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust-version: "1.96.0"
            rust-label: "msrv 1.96.0"
          - rust-version: stable
            rust-label: "stable"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.rust-version }}" \
            --profile minimal \
            --component rustfmt \
            --component clippy
      - name: Format
        run: cargo +"${{ matrix.rust-version }}" fmt --all --check
      - name: Clippy (warnings as errors)
        run: cargo +"${{ matrix.rust-version }}" clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +"${{ matrix.rust-version }}" test --workspace --all-features
      - name: Provider component fixture inventory
        run: cargo +"${{ matrix.rust-version }}" xtask provider-component-fixtures --check

  release-dates:
    name: release-dates (git tag reconciliation)
    runs-on: ubuntu-latest
    steps:
      # The reconciliation compares recorded dates against the tags that
      # published them, so this job needs the tags. The default shallow
      # checkout fetches none, which is why this cannot ride along on the
      # matrix job above.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Reconcile release dates against git tags
        run: cargo +stable xtask release-dates --check

  windows-lawpack-containment:
    name: windows lawpack containment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Write publication fails closed before I/O
        run: >-
          cargo +stable test -p edict-cli
          windows_lawpack_build_fails_closed_before_document_io
          -- --nocapture

  supply-chain:
    name: supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --locked --version 0.18.9
      - name: Check advisories, licenses, bans, and sources
        run: cargo +stable deny --locked check
      - name: Check provider fixture guest supply chain
        run: >-
          cargo +stable deny --locked
          --manifest-path fixtures/providers/components/guests/Cargo.toml check
