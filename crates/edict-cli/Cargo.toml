[package]
name = "edict-cli"
version = "0.11.0-alpha.1"
description = "Edict JSONL compiler command-line interface"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "edict"
path = "src/main.rs"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
edict-provider-host-wasmtime = { path = "../edict-provider-host-wasmtime" }
edict-provider-schema = { path = "../edict-provider-schema" }
edict-syntax = { path = "../edict-syntax" }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android", target_os = "redox"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
jsonschema = { version = "0.58.6", default-features = false }

[[example]]
name = "configurable-causal-cell"
path = "examples/configurable_causal_cell/main.rs"
