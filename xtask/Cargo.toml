[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
amblicit-provider-schema = { path = "../crates/amblicit-provider-schema" }
amblicit-syntax = { path = "../crates/amblicit-syntax" }
regex = "1"
serde_json = "1"
sha2 = "0.10.9"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
wasm-encoder = "=0.251.0"
wit-component = "=0.251.0"
wit-parser = { version = "=0.251.0", default-features = false, features = ["std"] }
wat = "=1.251.0"
